# Chess plugin configuration

win-reward:
  enabled: true
  amount: 100.0
  ai-games: false

puzzle:
  streak-bonus-days: 7
  streak-bonus: 50.0

gambit:
  double-multiplier: 2.0
  max-multiplier: 16.0

titles:
  - threshold: 800
    name: "Novice"
  - threshold: 1200
    name: "Intermediate"
  - threshold: 1600
    name: "Advanced"
  - threshold: 1800
    name: "Expert"
  - threshold: 2000
    name: "National Master"
  - threshold: 2200
    name: "Candidate Master"
  - threshold: 2300
    name: "FIDE Master"
  - threshold: 2400
    name: "International Master"
  - threshold: 2500
    name: "Grandmaster"

matchmaking:
  rating-band: 200
  default-time: 3

replay:
  max-games: 20
